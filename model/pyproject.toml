[project]
name = "model"
version = "0.1.0"
description = "E-waste price valuation model"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.2",
    "joblib>=1.5.2",
    "numpy>=2.0",
    "pandas>=2.3.2",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
